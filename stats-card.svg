<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1617"/>
      <stop offset="100%" stop-color="#141112"/>
    </linearGradient>
    
    <filter id="rose-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="450" height="200" rx="12" fill="url(#card-bg)" stroke="#362F32" stroke-width="1.5"/>

  <!-- Card Title -->
  <g transform="translate(25, 35)">
    <text font-family="'Cinzel', 'Georgia', serif" font-size="15" font-weight="700" fill="#E5A9B8" letter-spacing="1.5">
      LYRA-4LEAFCLOVER'S OVERVIEW
    </text>
    <line x1="0" y1="12" x2="400" y2="12" stroke="#E5A9B8" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Stats Rows -->
  <g transform="translate(25, 75)" font-family="'Inter', sans-serif" font-size="13">
    
    <g transform="translate(0, 0)">
      <text fill="#E8E2D9">⭐ Specialization:</text>
      <text x="390" text-anchor="end" fill="#E5A9B8" font-weight="600" filter="url(#rose-glow)">Data &amp; AI Engineering</text>
    </g>

    <g transform="translate(0, 30)">
      <text fill="#E8E2D9">📦 Core Stack:</text>
      <text x="390" text-anchor="end" fill="#E5A9B8" font-weight="600">Python, C, SQL, R</text>
    </g>

    <g transform="translate(0, 60)">
      <text fill="#E8E2D9">🔀 Systems &amp; Web:</text>
      <text x="390" text-anchor="end" fill="#E5A9B8" font-weight="600">IoT, HTML, CSS, Vercel</text>
    </g>

    <g transform="translate(0, 90)">
      <text fill="#E8E2D9">🔥 Tools &amp; IDEs:</text>
      <text x="390" text-anchor="end" fill="#E5A9B8" font-weight="600">JetBrains, VS Code, Git</text>
    </g>

  </g>
</svg>
