<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <defs>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    
    <filter id="rose-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Base Frame -->
  <rect width="850" height="170" rx="8" fill="url(#box-bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Code Block Text Content -->
  <g transform="translate(24, 34)" font-family="'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="14.5" xml:space="preserve">
    
    <!-- Line 1: identity: -->
    <text y="0" fill="#79c0ff" font-weight="600">identity:</text>

    <!-- Line 2: role: -->
    <text x="24" y="32" fill="#8b949e">role: <tspan fill="#E5A9B8" font-weight="500" filter="url(#rose-glow)">Student of B.Tech Computer Science</tspan></text>

    <!-- Line 3: passions: -->
    <text x="24" y="64" fill="#8b949e">passions: <tspan fill="#E8E2D9">[</tspan><tspan fill="#E5A9B8" font-weight="500">Data Analytics, Data Engineering, IoT, Creative Coding, UI/UX, AI</tspan><tspan fill="#E8E2D9">]</tspan></text>

    <!-- Line 4: current_focus: -->
    <text x="24" y="96" fill="#8b949e">current_focus: <tspan fill="#E5A9B8" font-weight="500" filter="url(#rose-glow)">Data Engineering, AI &amp; Creative Software Development</tspan></text>

  </g>
</svg>
