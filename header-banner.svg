<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121011"/>
      <stop offset="40%" stop-color="#1A1617"/>
      <stop offset="80%" stop-color="#241E20"/>
      <stop offset="100%" stop-color="#151213"/>
    </linearGradient>

    <!-- Lily Petal Gradient -->
    <linearGradient id="petal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C4CE" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E5A9B8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B87B8B" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="rose-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A9B8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E5A9B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E5A9B8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="block-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC0CB"/>
      <stop offset="40%" stop-color="#E5A9B8"/>
      <stop offset="100%" stop-color="#B87383"/>
    </linearGradient>

    <!-- Subtle Slate Teal Overlay Gradient -->
    <radialGradient id="teal-ambient" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5E7882" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#121011" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter Effects for Glow & Texture -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cyber-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-grad)"/>
  <rect width="1000" height="320" rx="16" fill="url(#teal-ambient)"/>

  <!-- Distressed Painterly Brush Strokes Background -->
  <g opacity="0.10" fill="#E8E2D9">
    <path d="M-20,40 Q150,-10 320,60 T600,10 T900,80 T1020,30 L1020,0 L-20,0 Z"/>
    <path d="M50,280 Q250,330 480,270 T820,310 T1040,260 L1040,320 L50,320 Z"/>
  </g>

  <!-- Ambient Light Halo -->
  <circle cx="160" cy="160" r="140" fill="#E5A9B8" opacity="0.08" filter="url(#soft-glow)"/>

  <!-- Left Side: Vector Stylized Lily Artwork -->
  <g transform="translate(30, 20)">
    <!-- Stems and Leaves -->
    <path d="M 110,270 Q 120,190 100,130" stroke="#3D4B40" stroke-width="3.5" fill="none" opacity="0.8"/>
    <path d="M 110,270 Q 90,210 60,170" stroke="#3D4B40" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 70,220 Q 40,200 20,210 Q 50,240 85,235" fill="#2D3A30" opacity="0.6"/>
    <path d="M 105,180 Q 140,160 165,175 Q 130,200 100,195" fill="#2D3A30" opacity="0.6"/>

    <!-- Main Lily Flower - Back Petals -->
    <path d="M 100,130 C 60,90 30,100 25,125 C 50,135 80,135 100,130 Z" fill="url(#petal-grad)" opacity="0.75"/>
    <path d="M 100,130 C 130,80 165,85 170,115 C 145,130 120,130 100,130 Z" fill="url(#petal-grad)" opacity="0.75"/>
    <path d="M 100,130 C 90,60 110,30 125,35 C 130,65 115,105 100,130 Z" fill="url(#petal-grad)" opacity="0.7"/>

    <!-- Main Lily Flower - Front Petals -->
    <path d="M 100,130 C 55,130 15,160 30,185 C 60,175 85,155 100,130 Z" fill="url(#petal-grad)"/>
    <path d="M 100,130 C 140,140 175,175 160,190 C 135,175 115,150 100,130 Z" fill="url(#petal-grad)"/>
    <path d="M 100,130 C 95,170 100,215 115,210 C 125,185 115,150 100,130 Z" fill="url(#petal-grad)"/>

    <!-- Stamens -->
    <path d="M 100,130 Q 90,110 75,95" stroke="#E6C280" stroke-width="1.5" fill="none"/>
    <ellipse cx="73" cy="93" rx="4" ry="2" fill="#C98B44" transform="rotate(-30 73 93)"/>
    <path d="M 100,130 Q 102,105 102,85" stroke="#E6C280" stroke-width="1.5" fill="none"/>
    <ellipse cx="102" cy="83" rx="4" ry="2" fill="#C98B44"/>
    <path d="M 100,130 Q 115,110 130,98" stroke="#E6C280" stroke-width="1.5" fill="none"/>
    <ellipse cx="132" cy="97" rx="4" ry="2" fill="#C98B44" transform="rotate(30 132 97)"/>
  </g>

  <!-- Floating Rose Petals -->
  <g fill="#E5A9B8" opacity="0.55" filter="url(#soft-glow)">
    <path d="M 230,80 C 240,75 250,85 245,95 C 235,98 225,90 230,80 Z" transform="rotate(15 235 85)"/>
    <path d="M 880,70 C 890,65 900,75 895,85 C 885,88 875,80 880,70 Z" transform="rotate(40 885 75)"/>
    <path d="M 920,230 C 930,225 940,235 935,245 C 925,248 915,240 920,230 Z" transform="rotate(-10 925 235)"/>
  </g>

  <!-- Decorative Frame Lines -->
  <line x1="300" y1="45" x2="900" y2="45" stroke="url(#rose-glow)" stroke-width="1.2"/>
  <line x1="300" y1="275" x2="900" y2="275" stroke="url(#rose-glow)" stroke-width="1.2"/>

  <!-- Tagline Top -->
  <text x="600" y="75" text-anchor="middle" font-family="'Georgia', serif" font-size="13" font-style="italic" letter-spacing="4" fill="#B88E9C">
    ✦ WELCOME TO MY DIGITAL SPACE ✦
  </text>

  <!-- CENTERPIECE: GLOWING CYBER MATRIX TEXT FOR "LYRA" -->
  <g transform="translate(385, 95)" filter="url(#cyber-glow)" fill="url(#block-grad)" stroke="#FFF" stroke-width="0.8" stroke-opacity="0.7">
    
    <!-- L (X: 0) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="16" height="15" rx="2"/>
      <rect x="0" y="18" width="16" height="15" rx="2"/>
      <rect x="0" y="36" width="16" height="15" rx="2"/>
      <rect x="0" y="54" width="16" height="15" rx="2"/>
      <rect x="0" y="72" width="16" height="15" rx="2"/>
      <rect x="19" y="72" width="16" height="15" rx="2"/>
      <rect x="38" y="72" width="16" height="15" rx="2"/>
      <rect x="57" y="72" width="16" height="15" rx="2"/>
    </g>

    <!-- Y (X: 100) -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="16" height="15" rx="2"/>
      <rect x="9" y="18" width="16" height="15" rx="2"/>
      <rect x="19" y="36" width="16" height="15" rx="2"/>
      <rect x="76" y="0" width="16" height="15" rx="2"/>
      <rect x="67" y="18" width="16" height="15" rx="2"/>
      <rect x="57" y="36" width="16" height="15" rx="2"/>
      <rect x="38" y="54" width="16" height="15" rx="2"/>
      <rect x="38" y="72" width="16" height="15" rx="2"/>
    </g>

    <!-- R (X: 220) -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="16" height="15" rx="2"/>
      <rect x="0" y="18" width="16" height="15" rx="2"/>
      <rect x="0" y="36" width="16" height="15" rx="2"/>
      <rect x="0" y="54" width="16" height="15" rx="2"/>
      <rect x="0" y="72" width="16" height="15" rx="2"/>
      <rect x="19" y="0" width="16" height="15" rx="2"/>
      <rect x="38" y="0" width="16" height="15" rx="2"/>
      <rect x="57" y="0" width="16" height="15" rx="2"/>
      <rect x="70" y="15" width="16" height="15" rx="2"/>
      <rect x="70" y="33" width="16" height="15" rx="2"/>
      <rect x="57" y="46" width="16" height="15" rx="2"/>
      <rect x="38" y="46" width="16" height="15" rx="2"/>
      <rect x="19" y="46" width="16" height="15" rx="2"/>
      <rect x="42" y="60" width="16" height="15" rx="2"/>
      <rect x="57" y="72" width="16" height="15" rx="2"/>
    </g>

    <!-- A (X: 340) -->
    <g transform="translate(340, 0)">
      <rect x="38" y="0" width="16" height="15" rx="2"/>
      <rect x="26" y="18" width="16" height="15" rx="2"/>
      <rect x="14" y="36" width="16" height="15" rx="2"/>
      <rect x="0" y="54" width="16" height="15" rx="2"/>
      <rect x="0" y="72" width="16" height="15" rx="2"/>
      <rect x="50" y="18" width="16" height="15" rx="2"/>
      <rect x="62" y="36" width="16" height="15" rx="2"/>
      <rect x="76" y="54" width="16" height="15" rx="2"/>
      <rect x="76" y="72" width="16" height="15" rx="2"/>
      <rect x="19" y="54" width="16" height="15" rx="2"/>
      <rect x="38" y="54" width="16" height="15" rx="2"/>
      <rect x="57" y="54" width="16" height="15" rx="2"/>
    </g>

  </g>

  <!-- Circuit Connection Traces Under LYRA Matrix -->
  <g stroke="#E5A9B8" stroke-width="1" fill="none" opacity="0.75" filter="url(#cyber-glow)">
    <path d="M 393,102 L 393,174 L 460,174"/>
    <path d="M 485,102 L 523,156 L 523,174 M 561,102 L 523,156"/>
    <path d="M 605,102 L 605,174 M 605,102 L 672,102 L 672,143 L 605,143 M 643,143 L 680,174"/>
    <path d="M 763,102 L 725,156 L 725,174 M 763,102 L 801,156 L 801,174 M 725,156 L 801,156"/>
  </g>

  <!-- Subtitle Details -->
  <text x="600" y="215" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="13" font-weight="300" letter-spacing="3" fill="#A89F95">
    B.Tech Computer Science • Data, IoT &amp; AI
  </text>

  <!-- Bottom Accent Badges / Pill Tags -->
  <g transform="translate(600, 248)">
    <rect x="-140" y="-12" width="80" height="24" rx="12" fill="#241E20" stroke="#E5A9B8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="-100" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E5A9B8" letter-spacing="1">DEVELOP</text>

    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#241E20" stroke="#E5A9B8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E5A9B8" letter-spacing="1">DATA &amp; AI</text>

    <rect x="60" y="-12" width="80" height="24" rx="12" fill="#241E20" stroke="#E5A9B8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="100" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E5A9B8" letter-spacing="1">CREATE</text>
  </g>
</svg>
